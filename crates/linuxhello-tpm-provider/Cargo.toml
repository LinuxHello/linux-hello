[package]
name = "linuxhello-tpm-provider"
description = "Provider for device-bound passkeys under a per-user TPM root key, behind the virtual CTAP authenticator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
linuxhello-dbus = { path = "../linuxhello-dbus" }
tss-esapi = { version = "7.7", optional = true }
rustix = { version = "1", default-features = false, features = ["std", "net"] }
zeroize = "1"

[features]
# The TPM itself. Off for a client of the provider (the Agent), which must not link the TSS2 C
# libraries: the Agent is a static, pure-Rust binary.
default = ["tpm"]
tpm = ["dep:tss-esapi"]

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
