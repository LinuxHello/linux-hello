[package]
name = "linuxhello-ctl"
description = "Command-line tool: enrol, change PIN, reset, inspect policy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
linuxhello-agent = { path = "../linuxhello-agent" }
linuxhello-dbus = { path = "../linuxhello-dbus" }
# Already in the tree through the Agent: the client of the Agent needs one bus connection for a whole
# prompt, which `busctl` calls cannot give.
rustix = { version = "1", default-features = false, features = ["std", "stdio", "termios"] }
async-io = "2"
futures-lite = "2"
serde = "1"
zbus = "6.2"
zeroize = "1"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
