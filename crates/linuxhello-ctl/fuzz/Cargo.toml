# Fuzz target for `linuxhello-ctl`. A separate workspace on a pinned nightly toolchain
# (rust-toolchain.toml here), because cargo-fuzz needs nightly sanitizer flags.
# Run with `make fuzz` from the repository root.
[package]
name = "linuxhello-ctl-fuzz"
version = "0.0.0"
edition = "2021"
license = "LGPL-3.0-or-later"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.linuxhello-dbus]
path = "../../linuxhello-dbus"

[[bin]]
name = "status_reply"
path = "fuzz_targets/status_reply.rs"
test = false
doc = false
bench = false
