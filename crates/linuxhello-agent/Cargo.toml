[package]
name = "linuxhello-agent"
description = "Linux Hello Agent: unlock state, auth state, routing policy, PIN, enrolment and reset"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
argon2 = { version = "0.6", features = ["zeroize"] }
async-io = "2"
futures-lite = "2"
linuxhello-dbus = { path = "../linuxhello-dbus" }
# Only its client and wire format: the TPM library stays off, so the Agent links no C library.
linuxhello-tpm-provider = { path = "../linuxhello-tpm-provider", default-features = false }
rustix = { version = "1", default-features = false, features = ["std", "net"] }
serde = { version = "1", features = ["derive"] }
toml = "1.1"
unicode-normalization = "0.1.26"
zbus = "6.2"
zeroize = "1"

[dev-dependencies]
# The tests run a provider and a software TPM.
linuxhello-tpm-provider = { path = "../linuxhello-tpm-provider", features = ["testing"] }
tempfile = "3.27.0"

[[bench]]
name = "latency"
path = "benches/latency/main.rs"
harness = false

[lints]
workspace = true
