[package]
name = "linuxhello-agent"
description = "Linux Hello Agent: unlock state, auth state, routing policy, PIN, enrolment and reset"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
async-io = "2"
futures-lite = "2"
linuxhello-dbus = { path = "../linuxhello-dbus" }
rustix = { version = "1", default-features = false, features = ["std", "net"] }
serde = { version = "1", features = ["derive"] }
toml = "1.1"
zbus = "6.2"
zeroize = "1"

[dev-dependencies]
tempfile = "3.27.0"

[[bench]]
name = "latency"
path = "benches/latency/main.rs"
harness = false

[lints]
workspace = true
