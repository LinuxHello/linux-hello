<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  System-bus policy of the Linux Hello Agent (ADR-0014). Install as
  /usr/share/dbus-1/system.d/io.github.LinuxHello.Agent1.conf.

  The Agent is one system service for all users. Any local user may call its methods; the Agent
  decides from the caller's credentials what the caller may ask. Its signals are unicast, so
  nobody may send a signal of its interface except the Agent's own user: a forged signal would
  tell a prompt something false. The default policy of the system bus runs before this file, and
  the last matching rule wins, so the denies below override its "allow signals".
-->
<busconfig>
  <!-- Only the Agent's user may own the name or send its signals. -->
  <policy user="linuxhello">
    <allow own="io.github.LinuxHello.Agent1"/>
    <allow send_destination="io.github.LinuxHello.Agent1"/>
    <allow send_type="signal" send_interface="io.github.LinuxHello.Agent1"/>
  </policy>

  <policy context="default">
    <deny own="io.github.LinuxHello.Agent1"/>

    <!-- Any local user may call the Agent's own interface and the standard introspection and
         ping interfaces. Properties and every other interface stay denied. -->
    <allow send_destination="io.github.LinuxHello.Agent1"
           send_interface="io.github.LinuxHello.Agent1"/>
    <allow send_destination="io.github.LinuxHello.Agent1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="io.github.LinuxHello.Agent1"
           send_interface="org.freedesktop.DBus.Peer"/>

    <!-- Nobody but the Agent's user sends a signal of the Agent's interface. -->
    <deny send_type="signal" send_interface="io.github.LinuxHello.Agent1"/>
  </policy>
</busconfig>
