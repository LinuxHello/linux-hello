[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
  "LGPL-3.0-or-later",
  # No GPL licence belongs here (C3). LGPL-3.0-only was allowed for credentialsd and
  # libwebauthn (spike 0013); Linux Hello uses neither (ADR-0005), so it was removed.
  "LGPL-2.1-or-later",
  "Apache-2.0",
  # Apache-2.0 with an exception that removes obligations (for binary distribution); no new
  # obligation over Apache-2.0. Needed by target-lexicon, which tss-esapi-sys builds with.
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[licenses.private]
# Workspace crates are publish = false; their licence comes from the workspace manifest.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
