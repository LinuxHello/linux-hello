[package]
name = "linuxhello-plasma"
description = "The Agent Link: the QML plugin through which Linux Hello's Plasma screens reach the Agent"
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
license = "LGPL-3.0-or-later"
repository = "https://github.com/LinuxHello/linux-hello"
publish = false

# A workspace of its own: this crate needs Qt to build, and the main workspace's gates do not
# install it (ADR-0028). Its CI job is `plasma` in .github/workflows/ci.yml.
[workspace]

[lib]
# A dynamic QML plugin, so that KDE's lock screen can import it as well as Linux Hello's greeter.
crate-type = ["cdylib"]

[dependencies]
linuxhello-dbus = { path = "../../crates/linuxhello-dbus" }
cxx = "1"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["qt_qml"] }
zbus = "6.2"
futures-lite = "2"
serde = "1"
serde_json = "1"

[build-dependencies]
cxx-qt-build = { version = "0.10.0", features = ["link_qt_object_files"] }

[lints.rust]
# "deny", not "forbid": the one bridge module needs a reviewed #[allow(unsafe_code)] (ADR-0028).
unsafe_code = "deny"
missing_docs = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
missing_docs_in_private_items = "deny"
