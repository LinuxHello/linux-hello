# SonarQube Cloud. Keys follow SonarQube Cloud's defaults for a GitHub import;
# they must match the organisation and project created there.
sonar.organization=linuxhello
sonar.projectKey=LinuxHello_linux-hello
sonar.projectName=Linux Hello

sonar.sources=crates
sonar.exclusions=**/target/**
sonar.sourceEncoding=UTF-8

# Reports produced by .github/workflows/sonar.yml
sonar.rust.clippyReport.reportPaths=clippy-report.json
sonar.rust.lcov.reportPaths=lcov.info
