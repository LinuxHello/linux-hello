# --- Project Identification ---
sonar.projectKey=LinuxHello_linux-hello
sonar.projectName=LinuxHello
sonar.organization=linuxhello
sonar.host.url=https://sonarcloud.io

# --- Code Structure ---
sonar.sources=.
# sonar.tests=tests

# --- Language & Encoding ---
sonar.sourceEncoding=UTF-8
sonar.python.version=3.10,3.11,3.12

# --- Rust Reports ---
sonar.rust.clippyReport.reportPaths=clippy-report.json
sonar.rust.lcov.reportPaths=lcov.info

# --- Exclusions ---
sonar.exclusions=**/venv/**,**/.venv/**,**/__pycache__/**,**/.pytest_cache/**,**/build/**,**/dist/**,**/*.egg-info/**,.git/**
