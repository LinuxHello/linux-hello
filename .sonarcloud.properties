# Path to sources
#sonar.sources=.
sonar.sources=.
#sonar.exclusions=
#sonar.inclusions=

# Path to tests
#sonar.tests=
#sonar.test.exclusions=
sonar.exclusions=**/venv/**,**/.venv/**,**/__pycache__/**,**/.pytest_cache/**,**/build/**,**/dist/**,**/*.egg-info/**,.git/**
#sonar.test.inclusions=

# Source encoding
#sonar.sourceEncoding=UTF-8
sonar.sourceEncoding=UTF-8

# --- Language & Encoding ---
sonar.python.version=3.10,3.11,3.12

# Exclusions for copy-paste detection
#sonar.cpd.exclusions=

# --- Test Coverage (Optional) ---
# Uncomment and adjust if using pytest with coverage.py
# sonar.python.coverage.reportPaths=coverage.xml

