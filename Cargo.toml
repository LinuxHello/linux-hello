[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.80"
license = "LGPL-3.0-or-later"
repository = "https://github.com/LinuxHello/linux-hello"
# Guardrail: nothing is published to crates.io until crate names are decided (one-way door).
publish = false

[workspace.lints.rust]
# "deny", not "forbid": forbid cannot be relaxed per module, and the TPM FFI and PAM
# entry-point modules need a reviewed #[allow(unsafe_code)]. Every other crate root
# sets #![forbid(unsafe_code)]; scripts/ci/unsafe-policy.sh enforces both rules.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
