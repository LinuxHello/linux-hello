name: Release

# A release is a crate tag such as agent-v0.1.0 (GOVERNANCE.md, repository topology).
# Nothing is published unless, in order (ADR-0006):
#   1. the tagged commit is on main and has a verified quality-gate attestation;
#   2. the binaries, source archive and SBOM are built from that commit;
#   3. build provenance and an SBOM attestation are signed with Sigstore;
#   4. the publish job verifies every attestation and checksum again.
on:
  push:
    tags: ["*-v*"]

# Actions are pinned to commit SHAs; Dependabot updates the SHA and the version comment.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: The tag points at a commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: That commit passed the quality gate on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/verify-quality-gate.sh "$GITHUB_SHA" refs/heads/main

  build:
    name: build
    needs: gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # Sigstore signing certificate
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - run: cargo install cargo-cyclonedx --version 0.5.9 --locked
      - name: Build binaries, source archive and SBOM
        run: scripts/ci/release-build.sh "$GITHUB_REF_NAME"
      - name: List the files the SBOM describes
        run: grep -v '\.cdx\.json$' dist/SHA256SUMS > "$RUNNER_TEMP/sbom-subjects.txt"
      - name: Build provenance for every file
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: SBOM attestation for the binaries and source archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/sbom-subjects.txt
          sbom-path: dist/${{ github.ref_name }}.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Checksums match
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS
      - name: Every file has provenance; binaries and source have an SBOM attestation
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          common=(--repo "$REPO" --signer-workflow "$REPO/.github/workflows/release.yml"
                  --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" --deny-self-hosted-runners)
          while read -r _ file; do
            gh attestation verify "$file" "${common[@]}"
            case "$file" in
              *.cdx.json) ;;
              *) gh attestation verify "$file" "${common[@]}" --predicate-type https://cyclonedx.org/bom ;;
            esac
          done < SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$REPO" --verify-tag --prerelease \
            --title "$GITHUB_REF_NAME" \
            --notes "Pre-alpha; not audited (SECURITY.md). Verify a file before use: gh attestation verify <file> --repo $REPO --signer-workflow $REPO/.github/workflows/release.yml --source-ref $GITHUB_REF. The SBOM is $GITHUB_REF_NAME.cdx.json."
