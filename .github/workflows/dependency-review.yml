name: Dependency review

on:
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request cancels the older run. A push to main is never
# cancelled and has its own group, so a quick second merge cannot replace its queued run:
# the quality-gate attestation comes from that run.
concurrency:
  group: dependency-review-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          # Same licence policy as deny.toml.
          allow-licenses: LGPL-3.0-or-later, LGPL-2.1-or-later, Apache-2.0, MIT, BSD-2-Clause, BSD-3-Clause, ISC, Unicode-3.0, Zlib
          # libfuzzer-sys is (MIT OR Apache-2.0) AND NCSA: NCSA covers the bundled LLVM
          # libFuzzer, a permissive licence. It is linked only into the fuzz binaries in
          # crates/*/fuzz, which are never released (ADR-0006). Exempt that package alone.
          allow-dependencies-licenses: pkg:cargo/libfuzzer-sys
