name: Docs site

# The code-level documentation site (ADR-0008, amendment 2026-11-05): rustdoc with
# private items, plus a structure tree and a dependency graph per crate target,
# generated by scripts/docs-site.sh. Not a gate: it is not in quality-gates.txt and
# signs nothing. Pull requests build it as an artifact; main publishes it on Pages.
# Actions are pinned to commit SHAs; Dependabot updates them.
on:
  pull_request:
  push:
    branches: [main]
  # Redeploy without a new commit, e.g. after GitHub cancelled a deployment: a
  # re-run reuses the commit as deployment id, and a cancelled id stays cancelled.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: docs-site
    runs-on: ubuntu-24.04
    env:
      CARGO_MODULES_VERSION: 0.28.0 # also pinned in scripts/docs-site.sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Graphviz
        run: sudo apt-get update -qq && sudo apt-get install --yes --no-install-recommends graphviz
      # cargo-modules has no release binaries; compile it once per version and keep it.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cargo-modules
        with:
          path: ~/.cargo-modules
          key: cargo-modules-${{ runner.os }}-${{ env.CARGO_MODULES_VERSION }}
      - name: cargo-modules
        if: steps.cargo-modules.outputs.cache-hit != 'true'
        run: cargo install cargo-modules --version "$CARGO_MODULES_VERSION" --locked --root ~/.cargo-modules
      - name: Build the site
        run: |
          export PATH="$HOME/.cargo-modules/bin:$PATH"
          scripts/docs-site.sh "$RUNNER_TEMP/site"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    name: docs-site-deploy
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write # Pages deployment token
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
